<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Edit profile')}"></head>
<body class="blogify-shell">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main id="main-content" class="mx-auto max-w-4xl px-4 py-10 sm:px-6 lg:px-8 lg:py-16">
    <div class="mb-8 flex flex-wrap items-end justify-between gap-4">
        <div><p class="blogify-muted text-sm uppercase tracking-[0.18em]">Account settings</p><h1 class="blogify-heading mt-3 text-4xl font-semibold tracking-[-0.04em]">Edit profile</h1><p class="blogify-muted mt-3">Shape how readers see you and your work.</p></div>
        <a th:href="@{/profile}" class="blogify-link text-sm font-semibold">Back to dashboard</a>
    </div>
    <form id="profile-form" th:action="@{/profile/complete}" th:object="${userProfileDTO}" method="post" enctype="multipart/form-data" class="space-y-6">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <section class="blogify-card p-6 sm:p-8">
            <h2 class="blogify-heading text-xl font-semibold">Profile image</h2>
            <div class="mt-5 flex flex-wrap items-center gap-5">
                <img id="profilePreview" th:if="${user.profilePicture}" th:src="@{${user.profilePicture}}" alt="Current profile picture" class="h-24 w-24 rounded-full object-cover">
                <div th:unless="${user.profilePicture}" class="blogify-image-placeholder h-24 w-24 rounded-full text-xs">No image</div>
                <div><label for="profilePicture" class="blogify-heading block text-sm font-semibold">Upload a new image</label><input id="profilePicture" name="profilePicture" type="file" accept="image/*" class="blogify-input mt-2 block rounded-xl px-3 py-2 text-sm"><p class="blogify-muted mt-2 text-xs">JPEG, PNG, GIF, or WEBP up to 2 MB.</p></div>
            </div>
        </section>
        <section class="blogify-card space-y-5 p-6 sm:p-8">
            <h2 class="blogify-heading text-xl font-semibold">About you</h2>
            <div><label for="name" class="blogify-heading block text-sm font-semibold">Full name</label><input id="name" th:field="*{fullName}" type="text" class="blogify-input mt-2 block w-full rounded-xl px-4 py-3" placeholder="Your full name"></div>
            <div><label for="tagline" class="blogify-heading block text-sm font-semibold">Tagline</label><input id="tagline" th:field="*{tagline}" type="text" class="blogify-input mt-2 block w-full rounded-xl px-4 py-3" placeholder="A short description of your work"></div>
            <div><label for="bio" class="blogify-heading block text-sm font-semibold">Bio</label><textarea id="bio" th:field="*{bio}" rows="5" class="blogify-input mt-2 block w-full rounded-xl px-4 py-3 leading-7" placeholder="Tell readers about yourself"></textarea></div>
        </section>
        <section class="blogify-card space-y-5 p-6 sm:p-8">
            <h2 class="blogify-heading text-xl font-semibold">Contact and links</h2>
            <div class="grid gap-5 sm:grid-cols-2">
                <div><label for="phone" class="blogify-heading block text-sm font-semibold">Phone number</label><input id="phone" th:field="*{phoneNumber}" type="tel" class="blogify-input mt-2 block w-full rounded-xl px-4 py-3"></div>
                <div><label for="dob" class="blogify-heading block text-sm font-semibold">Date of birth</label><input id="dob" th:field="*{dateOfBirth}" type="date" class="blogify-input mt-2 block w-full rounded-xl px-4 py-3"></div>
            </div>
            <div><label for="address" class="blogify-heading block text-sm font-semibold">Address</label><textarea id="address" th:field="*{address}" rows="3" class="blogify-input mt-2 block w-full rounded-xl px-4 py-3"></textarea></div>
            <div class="grid gap-5 sm:grid-cols-2">
                <div><label for="twitter" class="blogify-heading block text-sm font-semibold">Twitter handle</label><input id="twitter" th:field="*{twitterHandle}" type="text" class="blogify-input mt-2 block w-full rounded-xl px-4 py-3"></div>
                <div><label for="linkedin" class="blogify-heading block text-sm font-semibold">LinkedIn URL</label><input id="linkedin" th:field="*{linkedinUrl}" type="url" class="blogify-input mt-2 block w-full rounded-xl px-4 py-3"></div>
            </div>
            <div><label for="website" class="blogify-heading block text-sm font-semibold">Website</label><input id="website" th:field="*{website}" type="url" class="blogify-input mt-2 block w-full rounded-xl px-4 py-3"></div>
        </section>
        <div class="flex flex-wrap justify-end gap-3"><a th:href="@{/profile}" class="rounded-full border border-[var(--blogify-border)] px-5 py-3 text-sm font-semibold">Cancel</a><button type="submit" class="blogify-button-primary rounded-full px-5 py-3 text-sm font-semibold">Save profile</button></div>
    </form>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script>
document.getElementById("profilePicture")?.addEventListener("change", function () {
    const file = this.files[0];
    const preview = document.getElementById("profilePreview");
    if (!file || !preview) return;
    preview.src = URL.createObjectURL(file);
});
</script>
</body>
</html>
