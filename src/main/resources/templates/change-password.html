<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Change password')}"></head>
<body class="blogify-shell">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main id="main-content" class="mx-auto max-w-2xl px-4 py-12 sm:px-6 lg:px-8 lg:py-20">
    <div class="mb-8"><p class="blogify-muted text-sm uppercase tracking-[0.18em]">Account security</p><h1 class="blogify-heading mt-3 text-4xl font-semibold tracking-[-0.04em]">Change password</h1><p class="blogify-muted mt-3">Use a strong password you do not reuse elsewhere.</p></div>
    <div th:if="${error}" class="mb-6 rounded-xl border border-[var(--blogify-danger)] p-4 text-[var(--blogify-danger)]" role="alert" th:text="${error}">Unable to change password.</div>
    <form th:action="@{/profile/change-password}" th:object="${passwordChangeRequest}" method="post" class="blogify-card space-y-5 p-6 sm:p-8">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div><label for="currentPassword" class="blogify-heading block text-sm font-semibold">Current password</label><div class="relative mt-2"><input id="currentPassword" th:field="*{currentPassword}" type="password" autocomplete="current-password" required class="blogify-input block w-full rounded-xl px-4 py-3 pr-16"><button type="button" data-password-toggle aria-controls="currentPassword" aria-pressed="false" class="blogify-link absolute inset-y-0 right-3 my-auto h-10 px-2 text-sm font-semibold">Show</button></div></div>
        <div><label for="newPassword" class="blogify-heading block text-sm font-semibold">New password</label><div class="relative mt-2"><input id="newPassword" th:field="*{newPassword}" type="password" autocomplete="new-password" minlength="8" required class="blogify-input block w-full rounded-xl px-4 py-3 pr-16"><button type="button" data-password-toggle aria-controls="newPassword" aria-pressed="false" class="blogify-link absolute inset-y-0 right-3 my-auto h-10 px-2 text-sm font-semibold">Show</button></div><p class="blogify-muted mt-2 text-xs">Use at least 8 characters.</p></div>
        <div><label for="confirmPassword" class="blogify-heading block text-sm font-semibold">Confirm new password</label><div class="relative mt-2"><input id="confirmPassword" th:field="*{confirmPassword}" type="password" autocomplete="new-password" required class="blogify-input block w-full rounded-xl px-4 py-3 pr-16"><button type="button" data-password-toggle aria-controls="confirmPassword" aria-pressed="false" class="blogify-link absolute inset-y-0 right-3 my-auto h-10 px-2 text-sm font-semibold">Show</button></div></div>
        <div class="flex flex-wrap justify-end gap-3 pt-3"><a th:href="@{/profile}" class="rounded-full border border-[var(--blogify-border)] px-5 py-3 text-sm font-semibold">Cancel</a><button type="submit" class="blogify-button-primary rounded-full px-5 py-3 text-sm font-semibold">Update password</button></div>
    </form>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script defer th:src="@{/js/auth-visibility.js}"></script>
</body>
</html>
