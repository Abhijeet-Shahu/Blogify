<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - Blogify</title>
</head>
<body>
    <main>
        <h1>Change Password</h1>
        <p th:if="${error}" th:text="${error}"></p>
        <form th:action="@{/profile/change-password}" th:object="${passwordChangeRequest}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <label>Current password
                <input type="password" th:field="*{currentPassword}" required>
            </label>
            <label>New password
                <input type="password" th:field="*{newPassword}" minlength="8" required>
            </label>
            <label>Confirm new password
                <input type="password" th:field="*{confirmPassword}" required>
            </label>
            <button type="submit">Change password</button>
        </form>
    </main>
</body>
</html>
