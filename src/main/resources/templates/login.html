<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Blogify</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gray-50">

  <div class="w-full max-w-6xl bg-white rounded-lg shadow-md flex flex-col md:flex-row">
    
    <!-- Left side (Form) -->
    <div class="w-full md:w-1/2 p-8">
      <!-- Logo -->
      <a th:href="@{/}">
        <img th:src="@{/assets/Logo.png}" alt="Logo" class="w-[6rem] mb-6" />
      </a>
      
      <!-- Heading -->
      <h2 class="text-2xl font-bold mb-2">Sign in</h2>
      <p class="text-gray-600 mb-6">
        If you don't have an account register <br>
        You can <a th:href="@{/register}" class="text-blue-600 font-semibold">Register here!</a>
      </p>

      <!-- Error Messages -->
      <div th:if="${error}" class="mb-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded">
        <span th:text="${error}">
          Invalid username or password
        </span>
      </div>

      <div th:if="${message}" class="mb-4 p-3 bg-green-100 border border-green-400 text-green-700 rounded">
        <span th:text="${message}"></span>
      </div>

      <!-- Login Form -->
      <form th:action="@{/login}" method="post" class="space-y-4">
        <!-- CSRF Token - FIXED -->
        <input type="hidden" th:name="${_csrf != null ? _csrf.parameterName : '_csrf'}" 
               th:value="${_csrf != null ? _csrf.token : ''}" />
        
        <!-- Email -->
        <div>
          <label class="block text-sm mb-1">Email</label>
          <div class="flex items-center border-b border-gray-400">
            <span class="material-icons text-gray-500 mr-2">
              <img th:src="@{/assets/mail.jpg}" alt="mail" />
            </span>
            <input 
              type="email" 
              name="username"
              placeholder="Enter your email address" 
              class="w-full p-2 outline-none"
              required
              th:value="${param.email}"
            >
          </div>
        </div>

        <!-- Password -->
        <div>
          <label class="block text-sm mb-1">Password</label>
          <div class="flex items-center border-b border-gray-400">
            <span class="material-icons text-gray-500 mr-2">
              <img th:src="@{/assets/padlock.png}" alt="padlock" />
            </span>
            <input 
              type="password" 
              name="password"
              placeholder="Enter your Password" 
              class="w-full p-2 outline-none"
              required
            >
          </div>
        </div>

        <!-- Remember me & Forgot -->
        <div class="flex justify-between items-center text-sm">
          <label class="flex items-center space-x-2">
            <input type="checkbox" name="remember-me" class="w-4 h-4">
            <span>Remember me</span>
          </label>
          <a th:href="@{/forgot-password}" class="text-gray-600 hover:text-blue-600 hover:underline">Forgot Password ?</a>
        </div>

        <!-- Button -->
        <button type="submit" class="w-full bg-[#0C21C1] text-white py-3 rounded-full shadow-md hover:bg-blue-700 mt-6">
          Login
        </button>
      </form>

      <!-- OR Continue with -->
      <div class="mt-6 text-center text-gray-500">or continue with</div>
      <div class="flex justify-center gap-4 mt-4">
        <!-- Social Login Buttons -->
        <a th:href="@{/oauth2/authorization/facebook}" class="cursor-pointer">
          <img th:src="@{/assets/facebook.jpg}" alt="Facebook" class="w-8 h-8">
        </a>
        <a th:href="@{/oauth2/authorization/google}" class="cursor-pointer">
          <img th:src="@{/assets/google.jpg}" alt="Google" class="w-8 h-8">
        </a>
      </div>
    </div>

    <!-- Right side (Image) -->
    <div class="hidden md:flex w-1/2 bg-[#000842] text-white items-center justify-center p-8 rounded-xl m-2">
      <div class="text-center">
        <img th:src="@{/assets/Saly-10-removebg-preview.png}" class="w-76 mx-auto">
        <h2 class="text-2xl font-bold mt-4">Sign in to Blogify</h2>
      </div>
    </div>

  </div>

</body>
</html>
