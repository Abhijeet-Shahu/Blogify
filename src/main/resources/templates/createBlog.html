<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Write a story')}"></head>
<body class="blogify-shell">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main id="main-content" class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8">
    <div class="flex flex-wrap items-end justify-between gap-5">
        <div>
            <p class="blogify-muted text-sm font-semibold uppercase tracking-[0.2em]">Writing workspace</p>
            <h1 class="blogify-heading mt-3 text-4xl font-semibold tracking-[-0.04em]">Create a story</h1>
        </div>
        <a th:href="@{/profile}" class="blogify-link text-sm font-semibold">Back to dashboard</a>
    </div>
    <div th:if="${success}" class="mt-6 rounded-xl border border-[var(--blogify-accent-strong)] p-4" role="status" th:text="${success}">Saved.</div>
    <div th:if="${error}" class="mt-6 rounded-xl border border-[var(--blogify-danger)] p-4 text-[var(--blogify-danger)]" role="alert" th:text="${error}">There was an error.</div>

    <div id="aiNotification" class="hidden"></div>
    <form th:action="@{/blog/save}" method="post" enctype="multipart/form-data" id="blogForm" class="mt-8 grid gap-8 lg:grid-cols-[minmax(0,1fr)_20rem]">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" name="status" id="blogStatus" value="DRAFT">

        <section id="editorView" class="space-y-6">
            <div class="blogify-card p-6 sm:p-8">
                <label for="blogTitle" class="blogify-heading block text-sm font-semibold">Title</label>
                <input id="blogTitle" name="title" required maxlength="200" class="blogify-input mt-2 block w-full rounded-xl px-4 py-4 text-3xl font-semibold" placeholder="Give your story a clear title">
                <label for="blogContent" class="blogify-heading mt-8 block text-sm font-semibold">Content</label>
                <textarea id="blogContent" name="content" required maxlength="10000" rows="20" class="blogify-input mt-2 block w-full resize-y rounded-xl px-4 py-4 text-lg leading-8" placeholder="Start writing..."></textarea>
                <div class="mt-5 flex flex-wrap items-center justify-between gap-3">
                    <button id="AI" type="button" class="blogify-button-accent rounded-full px-4 py-2 text-sm font-semibold">Generate with AI</button>
                    <div class="blogify-muted flex gap-4 text-xs"><span><strong id="wordCount">0</strong> words</span><span><strong id="charCount">0</strong> characters</span><span><strong id="readTime">1 min</strong> read</span></div>
                </div>
            </div>
        </section>

        <section id="previewView" class="blogify-card hidden p-6 sm:p-8">
            <p class="blogify-muted text-sm uppercase tracking-[0.18em]">Preview</p>
            <h2 id="previewTitle" class="blogify-heading mt-5 text-4xl font-semibold">Your story title</h2>
            <div id="previewContent" class="article-content mt-8 whitespace-pre-wrap">Your story content will appear here.</div>
        </section>

        <aside class="space-y-5 lg:sticky lg:top-24 lg:self-start">
            <div class="blogify-card space-y-5 p-6">
                <div class="flex flex-wrap gap-3">
                    <button id="previewBtn" type="button" class="rounded-full border border-[var(--blogify-border)] px-4 py-2 text-sm font-semibold">Preview</button>
                    <button id="saveBtn" type="button" class="rounded-full border border-[var(--blogify-border)] px-4 py-2 text-sm font-semibold">Save draft</button>
                    <button id="publishBtn" type="button" class="blogify-button-primary rounded-full px-4 py-2 text-sm font-semibold">Publish</button>
                </div>
                <div>
                    <label for="categoryId" class="blogify-heading block text-sm font-semibold">Category</label>
                    <select id="categoryId" name="categoryId" required class="blogify-input mt-2 block w-full rounded-xl px-3 py-3">
                        <option value="">Choose a category</option>
                        <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}">Technology</option>
                    </select>
                </div>
                <div>
                    <label for="tags" class="blogify-heading block text-sm font-semibold">Tags</label>
                    <input id="tags" name="tags" maxlength="500" class="blogify-input mt-2 block w-full rounded-xl px-3 py-3" placeholder="technology, design">
                </div>
                <div>
                    <label for="excerpt" class="blogify-heading block text-sm font-semibold">Excerpt</label>
                    <textarea id="excerpt" name="excerpt" maxlength="500" rows="4" class="blogify-input mt-2 block w-full rounded-xl px-3 py-3" placeholder="A short summary of your story"></textarea>
                </div>
                <div>
                    <label for="featuredImage" class="blogify-heading block text-sm font-semibold">Featured image</label>
                    <input id="featuredImage" name="featuredImage" type="file" accept="image/*" class="blogify-input mt-2 block w-full rounded-xl px-3 py-3 text-sm">
                    <p class="blogify-muted mt-2 text-xs">JPEG, PNG, GIF, or WEBP up to 5 MB.</p>
                    <img id="imagePreview" alt="Selected featured image preview" class="mt-4 hidden max-h-48 w-full rounded-xl object-cover">
                </div>
            </div>
            <p class="blogify-muted text-xs">Your draft is submitted only when you choose Save draft. There is no automatic saving.</p>
        </aside>
    </form>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script defer th:src="@{/js/editor.js}"></script>
</body>
</html>
