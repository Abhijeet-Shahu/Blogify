# ===============================
# Application
# ===============================
spring.application.name=Blogify

# ===============================
# Server (Render provides PORT)
# ===============================
server.port=${PORT:8080}

# ===============================
# Database (Supabase PostgreSQL)
# ===============================
spring.datasource.url=${SUPABASE_DATABASE_URL}
spring.datasource.username=${SUPABASE_DATABASE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ===============================
# Connection Pool (Safe Defaults)
# ===============================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# ===============================
# Optional API integrations
# ===============================
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}
groq.api.key=${GROQ_API_KEY:}
stability.api.key=${STABILITY_API_KEY:}

# ===============================
# Logging (Production-safe defaults)
# ===============================
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF

# ===============================
# Actuator
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# AI endpoint rate limiting
ai.rate-limit.max-requests=${AI_RATE_LIMIT_MAX_REQUESTS:10}
ai.rate-limit.window-ms=${AI_RATE_LIMIT_WINDOW_MS:60000}
